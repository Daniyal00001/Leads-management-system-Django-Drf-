{% extends "base.html" %}
{% block title %}Access denied{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-20 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-rose-100 text-rose-500 text-2xl font-bold mb-5">
        403
    </div>
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Access Denied</h1>
    <p class="text-sm text-slate-500 max-w-md mb-6">
        This action belongs to a different role. Check the badges in the sidebar for the roles on your account, or ask a Super Admin to assign the right one.
    </p>
    <a href="{% url 'home' %}"
       class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-semibold bg-brand-600 text-white hover:bg-brand-500 shadow-sm transition-all">
        ← Back to dashboard
    </a>
</div>
{% endblock %}
